server:
  port: 8084
  servlet:
    context-path: /event

spring:
  app-name: booking_system_realm
  application:
    name: booking-event-service
  datasource:
    url: ${EVENT_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=event-service;encrypt=true;trustServerCertificate=true;}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 10
      connection-timeout: 3000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6319}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 3s
      lettuce:
        pool:
          max-active: 32
          max-idle: 8
          min-idle: 4

  jackson:
    serialization:
      indent-output: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        request.timeout.ms: 15000
        # must be >= linger.ms + request.timeout.ms
        delivery.timeout.ms: 30000
    consumer:
      group-id: event-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      # <= number of partitions (app.messaging.partitions); one ticket's events stay on one partition
      concurrency: 6

  security:
    keycloak:
      base-url: ${KEYCLOAK_URL:http://localhost:9999}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:9999}
  realm: master
  client-id: admin-cli
  principal-attribute: preferred_username
  bearer-only: true
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD}

app:
  security:
    cursor-secret-key: ${CURSOR_SECRET_KEY}
  internal:
    key: ${APP_INTERNAL_KEY}

  messaging:
    enabled: true
    partitions: 6
    replicas: 1

  outbox:
    poll-interval-ms: 200
    batch-size: 200
