server:
  port: 8888

app:
  api-prefix: /api/v1
  service:
    identity: http://localhost:8081
    profile: http://localhost:8082
    notification: http://localhost:8083
    event: http://localhost:8084
    order: http://localhost:8085
    keycloak-profile: http://localhost:8082
  # keycloak: verify Keycloak JWTs locally (default) | identity: introspect via identity-service
  auth:
    provider: keycloak
  keycloak:
    base-url: ${KEYCLOAK_URL:http://localhost:9999}
    realm: booking_system_realm


logging:
  level:
    org.springframework.cloud.gateway: DEBUG