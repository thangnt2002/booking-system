server:
  port: 8082
  servlet:
    context-path: /keycloak-profile

spring:
  app-name: booking_system_realm
  application:
    name: booking-profile-service

  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: revertAccountMsg:com.booking.profileservice.event.ProfileRevertEvent,notificationMsg:com.booking.profileservice.event.NotificationEvent

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=keycloak-profile-service;encrypt=true;trustServerCertificate=true;
    username: sa
    password: Thmt20021001.
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect


  data:
    redis:
      host: 127.0.0.1
      port: 6319
      password: ""
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 5
      connect-timeout: 30000

  jackson:
    serialization:
      indent-output: true

  security:
    keycloak:
      base-url: http://localhost:9999

app:
  internal:
    key: key

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

keycloak:
  auth-server-url: http://localhost:9999
  realm: master
  client-id: admin-cli
  principal-attribute: preferred_username
  bearer-only: true
  admin:
    username: admin
    password: bitnami123

